services:
  postgres:
    image: postgres:16-alpine
    container_name: safetransit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: safetransit
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d safetransit"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: safetransit-server
    restart: unless-stopped
    environment:
      PORT: 5005
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/safetransit
      JWT_SECRET: safetransit-super-secret-key-2026
      CLIENT_URL: http://localhost:5173
    ports:
      - "5005:5005"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: safetransit-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  postgres_data:
